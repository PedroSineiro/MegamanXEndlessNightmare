<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Megaman X Endless Nightmare</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/images/favicon.png"
    >

    <style>

        @font-face {

            font-family: "MegaManX";

            src: url(
                "assets/fonts/MMRock9.otf"
            ) format(
                "truetype"
            );

        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background-image:
                url(
                    "assets/images/site_background.png"
                );

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

        }

        canvas { border: 2px solid white; }

        #font-preload {

            font-family: MegaManX;

            position: absolute;

            left: -9999px;

            visibility: hidden;

        }

    </style>

</head>

<body>

    <div id="font-preload">
        .
    </div>

    <div id="game-container">

        <!-- Phaser -->
        <script src="./libs/phaser.js"></script>

        <!-- Seu jogo -->
        <script
            type="module"
            src="./src/scenes/MainScene.js"
        ></script>

    </div>

</body>
</html>
